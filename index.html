function pad2(n){ return String(n).padStart(2,"0"); }
function nowLocalInput(){
  const d=new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
// fertiliser snapshot — same field names as the spray snapshot so history,
// export and the cost report keep working, plus the buying figures.
function fertSnapshot(){
  const S=STR[lang], T=treeQty(), chems=[];
  state.fert.items.forEach(it=>{
    const res=calcFert(it); if(!res.ok) return;
    const price=chemPriceByName(it.name);
    const cost=(price!=null && res.packsNeed!=null) ? price*res.packsNeed : null;
    chems.push({
      kind:"fert", name:(it.name||"").trim(), pack:(it.pack||"").trim(),
      rate:String(it.rate||""), rateUnit:it.rateUnit||"kg", per:String(it.per||"1"),
      byBag:!!res.byBag, byScoop:!!res.byScoop, scoopG:res.scoopG||null,
      bagG:res.bagG!=null?res.bagG:null, totalG:res.totalG!=null?res.totalG:null,
      disp:res.disp, dispUnit:res.dispUnit,
      perTree:res.perDisp, perTreeUnit:res.perUnit,
      packs:res.packsNeed, packUnit:S.bagWord,
      unitPrice: price!=null?price:null,
      priceMode: cost!=null?"pack":null, priceUnit: cost!=null?"pack":null,
      usedAmt:null, cost
    });
  });
  return { tank:"", trees:T||"", chems };
}
function mixSnapshot(){
  if(isFert()) return fertSnapshot();
  const V=tankVol(); const chems=[];
  state.chems.forEach(c=>{
    const res=calcChem(c); if(!res.ok) return;
    const packs=(res.packs!=null&&!res.packMismatch)?res.packs:null;
    // COST — two pricing modes, dose-priced (per ml/g) takes priority over pack-priced:
    let unitPrice=null, cost=null, priceMode=null, priceUnit=null, usedAmt=null;
    const dose=chemDoseByName(c.name);
    if(dose){
      // res.base is the total product used in base units (g for mass, ml for vol)
      // convert to the dose's priced unit if needed (base is g or ml; dose.unit is g or ml)
      const amt=res.base;   // already in g (mass) or ml (vol)
      // only price if the family matches the dose unit's family
      const doseFamily = dose.unit==="g" ? "mass" : "vol";
      if(res.family===doseFamily){
        usedAmt=amt; unitPrice=dose.price; priceMode="dose"; priceUnit=dose.unit;
        cost=amt*dose.price;
      }
    }
    if(cost==null){
      const pp=chemPriceByName(c.name);
      if(pp!=null && packs!=null){ unitPrice=pp; cost=pp*packs; priceMode="pack"; priceUnit="pack"; }
    }
    chems.push({
      name:(c.name||"").trim(), pack:(c.pack||"").trim(),
      mode:c.mode, rate:String(c.rate||""), basis:String(c.basis||"1"),
      disp:res.disp, dispUnit:res.dispUnit,
      packs,
      packUnit:res.family==="mass"?STR[lang].bagUnit:STR[lang].bottleUnit,
      unitPrice: unitPrice!=null ? unitPrice : null,
      priceMode,                 // "dose" | "pack" | null
      priceUnit,                 // "ml" | "g" | "pack" | null
      usedAmt: usedAmt!=null ? usedAmt : null,   // amount used in priceUnit (dose mode)
      cost: cost!=null ? cost : null
    });
  });
  return { tank:V||"", chems };
}

// how many trees a selected target covers
function targetTreeCount(t){
  const f=(lists.farms||[]).find(x=>x.id===t.fid); if(!f) return 0;
  if(t.kind==="farm") return farmTotalTrees(f);
  const z=(f.zones||[]).find(x=>x.id===t.zid); if(!z) return 0;
  if(t.kind==="zone") return zoneTotalTrees(z);
  if(t.kind==="row"){ const r=(z.rows||[]).find(x=>x.id===t.rid); return r?rangeCount(r.tFrom,r.tTo):0; }
  if(t.kind==="trees") return rangeCount(t.from,t.to);
  return 0;
}
function fertTargetTrees(){ return (state.fert.targets||[]).reduce((a,t)=>a+targetTreeCount(t),0); }
function targetLabel(t){
  const S=STR[lang];
  const f=lists.farms.find(x=>x.id===t.fid); if(!f) return "?";
  if(t.kind==="farm") return `${f.name} · ${S.entireFarm}`;
  const z=(f.zones||[]).find(x=>x.id===t.zid);
  const zoneN = z ? `${S.zonePrefix}${z.name}` : "?";
  if(t.kind==="zone") return `${f.name} › ${zoneN}`;
  if(t.kind==="row"){ const r=z&&(z.rows||[]).find(x=>x.id===t.rid); return `${f.name} › ${zoneN} › ${r?S.rowPrefix+r.name:"?"}`; }
  if(t.kind==="trees"){
    const r=z&&(z.rows||[]).find(x=>x.id===t.rid);
    const base=`${f.name} › ${zoneN}${r?` › ${S.rowPrefix}${r.name}`:""}`;
    const span = (t.from===t.to) ? `${S.treeShort}${t.from}` : `${S.treeShort}${t.from}–${t.to}`;
    return `${base} · ${span}`;
  }
  return "?";
}

function renderTargetPicker(){
  const S=STR[lang], host=$("#targetPicker"); host.innerHTML="";
  renderTargetCrumb();
  const farms=aliveSorted(lists.farms);
  if(!farms.length){ host.appendChild(tpEl("div","log-empty",S.logNoFarms)); return; }

  // STEP: pick farm
  if(tpNav.step==="farm"){
    host.appendChild(tpEl("div","tp-scope",S.tpPickFarm));
    farms.forEach(f=> host.appendChild(tpBtn(f.name,"tp-drill",()=>{ tpNav={step:"level", fid:f.id}; renderTargetPicker(); })));
    return;
  }

  const f=tpFarm();
  // STEP: pick granularity level
  if(tpNav.step==="level"){
    host.appendChild(tpEl("div","tp-scope",S.tpPickLevel));
    // Entire farm — adds immediately and closes
    host.appendChild(tpBtn(S.lvlFarm,"tp-farmopt",()=>{ addTarget({kind:"farm", fid:f.id}); closeTargetSheet(); }));
    host.appendChild(tpBtn(S.lvlZones,"tp-drill",()=>{ tpNav={step:"zones", fid:f.id}; renderTargetPicker(); }));
    host.appendChild(tpBtn(S.lvlRows,"tp-drill",()=>{ tpNav={step:"rowsPickZone", fid:f.id}; renderTargetPicker(); }));
    host.appendChild(tpBtn(S.lvlTrees,"tp-drill",()=>{ tpNav={step:"treesPickZone", fid:f.id}; renderTargetPicker(); }));
    return;
  }

  // STEP: zones — multi-select (tap to add/remove), then Done
  if(tpNav.step==="zones"){
    const zones=aliveSorted(f.zones);
    host.appendChild(tpEl("div","tp-scope",S.tpTapZones));
    if(!zones.length){ host.appendChild(tpEl("div","log-empty",S.tpNoZones)); }
    renderMultiSelect(host, zones, {
      isOn: z=>targetChosen(t=>t.kind==="zone"&&t.fid===f.id&&t.zid===z.id),
      toggle: (z,on)=>{ if(on){ tpHost.targets=tpHost.targets.filter(t=>!(t.kind==="zone"&&t.fid===f.id&&t.zid===z.id)); tpRender(); } else { tpHost.targets.push({kind:"zone", fid:f.id, zid:z.id}); tpRender(); } }
    });
    host.appendChild(tpDoneBar());
    return;
  }

  // STEP: rows — first pick which zone, then multi-select rows
  if(tpNav.step==="rowsPickZone"){
    const zones=aliveSorted(f.zones).filter(z=>z.hasRows);
    host.appendChild(tpEl("div","tp-scope",S.tpPickZoneForRows));
    if(!zones.length){ host.appendChild(tpEl("div","log-empty",S.tpNoRowZones)); }
    renderDrillList(host, zones, z=>{ tpNav={step:"rows", fid:f.id, zid:z.id}; renderTargetPicker(); });
    return;
  }
  if(tpNav.step==="rows"){
    const z=tpZoneOf(tpNav.zid), rows=aliveSorted(z.rows);
    host.appendChild(tpEl("div","tp-scope",S.tpTapRows(z.name)));
    if(!rows.length){ host.appendChild(tpEl("div","log-empty",S.tpNoRows)); }
    renderMultiSelect(host, rows, {
      isOn: r=>targetChosen(t=>t.kind==="row"&&t.fid===f.id&&t.zid===z.id&&t.rid===r.id),
      toggle: (r,on)=>{ if(on){ tpHost.targets=tpHost.targets.filter(t=>!(t.kind==="row"&&t.fid===f.id&&t.zid===z.id&&t.rid===r.id)); tpRender(); } else { tpHost.targets.push({kind:"row", fid:f.id, zid:z.id, rid:r.id}); tpRender(); } }
    });
    host.appendChild(tpDoneBar(()=>{ tpNav={step:"rowsPickZone", fid:f.id}; renderTargetPicker(); }, S.tpBackZones));
    return;
  }

  // STEP: trees — pick zone, (pick row if zone has rows), then type range
  if(tpNav.step==="treesPickZone"){
    const zones=aliveSorted(f.zones);
    host.appendChild(tpEl("div","tp-scope",S.tpPickZoneForTrees));
    if(!zones.length){ host.appendChild(tpEl("div","log-empty",S.tpNoZones)); }
    renderDrillList(host, zones, z=>{
      tpNav = z.hasRows ? {step:"treesPickRow", fid:f.id, zid:z.id} : {step:"trees", fid:f.id, zid:z.id};
      renderTargetPicker();
    });
    return;
  }
  if(tpNav.step==="treesPickRow"){
    const z=tpZoneOf(tpNav.zid), rows=aliveSorted(z.rows);
    host.appendChild(tpEl("div","tp-scope",S.tpPickRowForTrees(z.name)));
    if(!rows.length){ host.appendChild(tpEl("div","log-empty",S.tpNoRows)); }
    renderDrillList(host, rows, r=>{ tpNav={step:"trees", fid:f.id, zid:z.id, rid:r.id}; renderTargetPicker(); });
    return;
  }
  if(tpNav.step==="trees"){
    const z=tpZoneOf(tpNav.zid), r=z&&tpNav.rid&&(z.rows||[]).find(x=>x.id===tpNav.rid);
    const def = r ? {from:r.tFrom,to:r.tTo} : {from:z.tFrom,to:z.tTo};
    host.appendChild(tpEl("div","tp-scope",S.tpTreesIn(r?r.name:z.name)));
    host.appendChild(tpEl("div","tp-hint",S.tpTreesHint));
    const wrap=document.createElement("div"); wrap.className="tp-trees";
    wrap.innerHTML=`<span class="zt-lab">${S.treeShort}</span>
      <input class="tp-tf" name="tpTreeFrom" aria-label="${S.ariaTreeFrom}" inputmode="numeric" type="text" value="${esc(def.from||"")}">
      <span class="zt-dash">–</span>
      <input class="tp-tt" name="tpTreeTo" aria-label="${S.ariaTreeTo}" inputmode="numeric" type="text" value="${esc(def.to||"")}">
      <button class="tp-treebtn">＋</button>`;
    const tf=wrap.querySelector(".tp-tf"), tt=wrap.querySelector(".tp-tt");
    tf.oninput=e=>e.target.value=e.target.value.replace(/[^\d]/g,"");
    tt.oninput=e=>e.target.value=e.target.value.replace(/[^\d]/g,"");
    wrap.querySelector(".tp-treebtn").onclick=()=>{
      const from=parseInt(tf.value,10), to=parseInt(tt.value,10);
      if(!(from>0)||!(to>0)||to<from){ wrap.classList.add("bad"); setTimeout(()=>wrap.classList.remove("bad"),600); return; }
      const t = r ? {kind:"trees", fid:f.id, zid:z.id, rid:r.id, from, to} : {kind:"trees", fid:f.id, zid:z.id, from, to};
      addTarget(t); closeTargetSheet();
    };
    host.appendChild(wrap);
    return;
  }
}

function fmtWhen(iso){ if(!iso) return "—"; const d=new Date(iso); if(isNaN(d)) return iso;
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
// ===================== STOCK =====================
// A trust system, not an audit. Three kinds of movement:
//   IN     bought or received   (entered by hand, or from the buying panel)
//   USE    applied              (DERIVED from the logs, never stored — so
//                                deleting or restoring a log self-corrects)
//   COUNT  physically counted   (ground truth: it SETS the balance)
// Everything is held in packs (bags/bottles), because that is how farmers buy
// and count. Products are matched loosely, by name.
function prodKey(name){ return String(name||"").trim().toLowerCase().replace(/\s+/g," "); }

function saveMoves(){ stampChanged("moves", moves); store("tm_moves", JSON.stringify(moves)); }
function aliveMoves(){ return moves.filter(m=>!m.deleted); }
function moveRemove(id){ const m=moves.find(x=>x.id===id); if(m){ m.deleted=nowTs(); saveMoves(); } }

// one-off migration of the earlier count-only store
(function(){
  if(localStorage.getItem("tm_stock_migrated")) return;
  let old=[]; try{ old=JSON.parse(localStorage.getItem("tm_stock"))||[]; }catch(e){}
  (Array.isArray(old)?old:[]).filter(r=>r&&!r.deleted).forEach(r=>{
    (r.items||[]).forEach(it=>{
      const packG=it.pack?(parsePack(it.pack)||{}).baseVal:null;
      const packs=(parseFloat(it.bags)||0) + (packG&&it.openG?it.openG/packG:0);
      moves.push({id:newId(), ts:nowTs(), when:r.when, key:prodKey(it.name), name:it.name,
                  pack:it.pack||"", kind:"count", packs, note:r.note||""});
    });
  });
  if(moves.length) saveMoves();
  localStorage.setItem("tm_stock_migrated","1");
})();

// usage read straight off the logs
function usageEvents(){
  const out=[];
  aliveLogs().forEach(r=>{
    (r.chems||[]).forEach(c=>{
      const key=prodKey(c.name); if(!key) return;
      const packs=parseFloat(c.packs);
      if(!(packs>0)) return;
      out.push({id:"L"+r.id+"|"+key, when:r.when, key, name:(c.name||"").trim(),
                pack:c.pack||"", kind:"use", packs, logId:r.id,
                mode:r.mode==="fert"?"fert":"spray"});
    });
  });
  return out;
}
function stockEvents(key){
  const all=[...aliveMoves().map(m=>({...m})), ...usageEvents()];
  const f=key?all.filter(e=>e.key===key):all;
  return f.sort((a,b)=> String(a.when||"").localeCompare(String(b.when||"")) || (a.ts||0)-(b.ts||0));
}
// balance as of `upto` (exclusive when given); a COUNT resets it
function stockBalance(key, upto){
  let bal=0, lastCount=null, seen=false, based=false, used=0;
  stockEvents(key).forEach(e=>{
    if(upto && String(e.when||"") >= String(upto)) return;
    seen=true;
    if(e.kind==="count"){ bal=e.packs; lastCount=e; based=true; }
    else if(e.kind==="in"){ bal+=e.packs; based=true; }
    else if(e.kind==="use"){ bal-=e.packs; used+=e.packs; }
  });
  // `based` = something was actually put in or counted. Without it we know what
  // was used but not what was there, so we must not claim a balance.
  return {bal, lastCount, known:seen, based, used};
}
// every product the app has ever seen, loosely matched by name
function stockProducts(){
  const m=new Map();
  const put=(name,pack)=>{ const k=prodKey(name); if(!k) return;
    if(!m.has(k)) m.set(k,{key:k, name:String(name).trim(), pack:pack||""});
    else if(pack && !m.get(k).pack) m.get(k).pack=pack; };
  alive(lists.chemProducts||[]).forEach(p=>put(p.name,p.pack));
  aliveLogs().forEach(r=>(r.chems||[]).forEach(c=>put(c.name,c.pack)));
  aliveMoves().forEach(mv=>put(mv.name,mv.pack));
  (state.fert.items||[]).forEach(it=>put(it.name,it.pack));
  (state.chems||[]).forEach(c=>put(c.name,c.pack));
  // A pack size can change — a 1kg bottle replaced by a 2kg one. The newest
  // movement wins; keeping the first one ever seen made old counts misreport.
  aliveMoves().slice()
    .sort((a,b)=> String(a.when||"").localeCompare(String(b.when||"")) || (a.ts||0)-(b.ts||0))
    .forEach(mv=>{ const k=prodKey(mv.name);
      if(m.has(k) && String(mv.pack||"").trim()) m.get(k).pack=String(mv.pack).trim(); });
  return [...m.values()].sort((a,b)=>natCmp(a.name,b.name));
}
// fertiliser or spray chemical, from wherever the app has seen it used
// Inference can only see how a product was used, so foliar fertiliser looks
// like a chemical. A tag the farmer sets overrides it. Built-ins are stored as
// tokens ("spray"/"fert") so they follow the interface language; anything else
// is stored as typed.
// Tags are held as a comma-separated string, so data written when a product
// could only have one tag still reads correctly.
function productTags(key){
  const p=alive(lists.chemProducts).find(x=>prodKey(x.name)===key);
  const list=String(p?p.tag||"":"").split(",").map(t=>t.trim()).filter(Boolean);
  if(list.length) return list;
  const inf=productSide(key);
  return inf?[inf]:[];               // nothing set: fall back to what we can infer
}
function productTag(key){            // the first one, where only one fits
  return productTags(key)[0] || "other";
}
// "Foliar" typed by hand is the built-in foliar, not a new tag that happens to
// look identical. Match against both languages' labels.
function normaliseTag(v){
  const t=String(v||"").trim();
  if(!t) return "";
  const lower=t.toLowerCase();
  for(const tok of ["spray","fert","foliar","herb","insect","fung","adj","other"]){
    for(const L of ["zh","en"]){
      const key={spray:"sideSprayH",fert:"sideFertH",foliar:"sideFoliarH",
                 herb:"sideHerbH",insect:"sideInsectH",fung:"sideFungH",
                 adj:"sideAdjH",other:"sideOtherH"}[tok];
      const lab=String(STR[L][key]||"").trim().toLowerCase();
      if(lab && lab===lower) return tok;
    }
    if(tok===lower) return tok;
  }
  return t;
}
// a cleared set of tags waits in the trash until it is restored or purged
function tagBinAdd(name, tags){
  if(!tags || !tags.length) return;
  lists.tagBin=lists.tagBin||[];
  lists.tagBin.push({id:newId(), name:String(name||"").trim(),
                     tags:tags.join(","), deleted:nowTs()});
  saveLists();
}
function writeTags(name, list){
  const nm=String(name||"").trim(); if(!nm) return;
  const clean=[...new Set(list.map(normaliseTag).filter(Boolean))];
  clean.forEach(rememberTagName);
  const val=clean.join(",");
  const hit=alive(lists.chemProducts).find(x=>prodKey(x.name)===prodKey(nm));
  if(hit) chemProductSet(hit.id,"tag",val);
  else { const c=chemProductAdd(nm,"",""); if(c) chemProductSet(c.id,"tag",val); }
}
function setProductTag(name, tag){   // replace whatever is there with one tag
  writeTags(name, tag?[tag]:[]);
}
function toggleProductTag(name, tag){
  const t=normaliseTag(tag); if(!t) return;
  const key=prodKey(name);
  const p=alive(lists.chemProducts).find(x=>prodKey(x.name)===key);
  // an inferred tag is a guess, not a choice, so don't adopt it on the first tap
  const cur=(p && String(p.tag||"").trim()) ? productTags(key) : [];
  writeTags(name, cur.includes(t) ? cur.filter(x=>x!==t) : [...cur, t]);
}
function tagLabel(t){
  const S=STR[lang];
  return t==="spray"?S.sideSprayH : t==="fert"?S.sideFertH
       : t==="foliar"?S.sideFoliarH : t==="herb"?S.sideHerbH
       : t==="insect"?S.sideInsectH : t==="fung"?S.sideFungH
       : t==="adj"?S.sideAdjH : t==="other"?S.sideOtherH : t;
}
// every group in use, built-ins first then the farmer's own
function allTags(){
  // the jobs a product is bought to do — a new farmer reads these as a reminder
  const out=["fert","foliar","insect","fung","herb","adj","spray"];
  alive(lists.chemProducts).forEach(p=>{
    String(p.tag||"").split(",").map(t=>t.trim()).filter(Boolean)
      .forEach(t=>{ if(!out.includes(t)) out.push(t); });
  });
  // names you invented stay on offer even when nothing carries them right now,
  // so clearing a product never costs you the tag itself
  (lists.tagNames||[]).forEach(t=>{ if(t && !out.includes(t)) out.push(t); });
  return out;
}
function rememberTagName(t){
  const v=String(t||"").trim();
  if(!v || normaliseTag(v)!==v) return;      // built-ins need no remembering
  lists.tagNames=lists.tagNames||[];
  if(!lists.tagNames.includes(v)){ lists.tagNames.push(v); saveLists(); }
}
function productSide(key){
  let fert=false, spray=false;
  (state.fert.items||[]).forEach(it=>{ if(prodKey(it.name)===key) fert=true; });
  (state.chems||[]).forEach(c=>{ if(prodKey(c.name)===key) spray=true; });
  aliveLogs().forEach(r=>(r.chems||[]).forEach(c=>{
    if(prodKey(c.name)!==key) return;
    if(r.mode==="fert") fert=true; else spray=true;
  }));
  if(fert && !spray) return "fert";
  if(spray && !fert) return "spray";
  return null;                       // used both ways, or never used yet
}
// A plantation can hold 30 products. Showing every one as a chip buries the
// form, so offer the ones actually in use and let typing narrow the rest.
const CHIP_LIMIT=8;
function recentProducts(){
  const last=new Map();
  aliveMoves().forEach(m=>{
    const k=prodKey(m.name), t=String(m.when||"");
    if(!last.has(k) || t>last.get(k)) last.set(k,t);
  });
  return stockProducts().slice().sort((a,b)=>{
    const ta=last.get(a.key)||"", tb=last.get(b.key)||"";
    if(ta!==tb) return tb.localeCompare(ta);      // most recently handled first
    return natCmp(a.name,b.name);
  });
}
function chipList(typed){
  const q=String(typed||"").trim().toLowerCase();
  const all=recentProducts();
  // Once the text IS a product (it was picked, or typed in full), go back to
  // the normal list — otherwise the chips collapse to the one already chosen
  // and there is no way to switch without clearing the field first.
  const exact=q && all.some(p=>p.key===prodKey(q));
  if(q && !exact){
    const hit=all.filter(p=>p.name.toLowerCase().includes(q));
    return {shown:hit.slice(0,12), hidden:Math.max(0,hit.length-12), filtered:true};
  }
  let shown=all.slice(0,CHIP_LIMIT);
  if(exact && !shown.some(p=>p.key===prodKey(q))){
    const sel=all.find(p=>p.key===prodKey(q));      // keep the chosen one visible
    shown=[sel, ...shown.slice(0,CHIP_LIMIT-1)];
  }
  return {shown, hidden:Math.max(0,all.length-shown.length), filtered:false};
}
function chipsHTML(typed, selectedKey){
  const S=STR[lang], {shown,hidden,filtered}=chipList(typed);
  if(!shown.length && !hidden) return "";
  const btns=shown.map((p,i)=>
    `<button class="prod-chip${selectedKey===p.key?" on":""}" type="button" data-k="${esc(p.key)}">${esc(p.name)}</button>`).join("");
  const more = hidden ? `<span class="chip-more">${filtered?S.chipMoreHits(hidden):S.chipMore(hidden)}</span>` : "";
  return `<div class="prod-chips">${btns}${more}</div>`;
}
function packOf(key){ const p=stockProducts().find(x=>x.key===key); return p?p.pack:""; }
// packs -> "12.4 包 (310 kg)" when the pack size is known
// Always a plain positive quantity — "12 包 (240 kg)". Direction is said in
// words by the caller, because a lone minus sign reads badly on a phone.
// Bags are counted in 包, bottles in 瓶. Which one depends on the pack size,
// so a 250ml product reads "2 bottles" and a 25kg one "2 packs".
function unitWord(n, pack){
  const pk=pack?parsePack(pack):null;
  const vol=pk && pk.family==="vol";
  if(lang==="zh") return vol ? STR.zh.bottleWord : STR.zh.bagWord;
  return vol ? (Math.abs(n)===1?"bottle":"bottles") : (Math.abs(n)===1?"pack":"packs");
}
function packWord(n){ return unitWord(n, ""); }
function packsLabel(packs,pack){
  const S=STR[lang];
  const n=Math.round(Math.abs(packs)*100)/100;
  const t=`${fmt(n)} ${unitWord(n, pack)}`;
  const pk=pack?parsePack(pack):null;
  if(!pk || n===0) return t;
  const m=scaleAmount(n*pk.baseVal, pk.family);
  const v=Math.round(m.val*100)/100;
  return v ? `${t} (${fmt(v)} ${m.unit})` : t;
}

// Never leave more than one empty row lying around — an empty folded row says
// nothing and only makes the list longer.
function blankCountItem(){ return {id:newId(), name:"", pack:"", bags:"", open:""}; }

function countItemPacks(it){
  const pk=it.pack?parsePack(it.pack):null;
  const bags=parseFloat(it.bags)||0;
  const op=it.open?parsePack(it.open):null;
  // an opened bottle is measured in ml, an opened bag in kg — they must match
  const sameFamily = pk && op && op.family===pk.family;
  const openBase = sameFamily ? op.baseVal : null;
  const packs=bags + (pk&&openBase?openBase/pk.baseVal:0);
  return {packs, bags, openBase, openG:openBase, packG:pk?pk.baseVal:null,
          family:pk?pk.family:null,
          mismatch: !!(pk && op && !sameFamily)};
}

function renderStockBalances(){
  const S=STR[lang], host=$("#stockBalances"); host.innerHTML="";
  // How much is there. Nothing else — price belongs to buying, not to counting.
  const known=stockProducts().map(p=>({...p, ...stockBalance(p.key)})).filter(p=>p.based);
  // keep negatives: "over by 2" is worth seeing. Drop only a true zero.
  let all=known.filter(p=>Math.abs(p.bal)>1e-9);
  const allEmpty = known.length>0 && all.length===0;
  const fEl=$("#balFilter");
  if(fEl){
    fEl.hidden = all.length<=8;                 // only worth it on a real store room
    fEl.placeholder=S.balSearch;
    const q=String(fEl.value||"").trim().toLowerCase();
    if(!fEl.hidden && q) all=all.filter(p=>
      p.name.toLowerCase().includes(q) ||
      productTags(p.key).some(t=>tagLabel(t).toLowerCase().includes(q)));
    if(!fEl.dataset.wired){
      fEl.dataset.wired="1";
      fEl.oninput=()=>renderStockBalances();
    }
  }
  if(!all.length){
    const fq=fEl && !fEl.hidden && String(fEl.value||"").trim();
    host.innerHTML=`<div class="ent-empty">${fq?S.balNoHits:(allEmpty?S.stockAllZero:S.stockNoBal)}</div>`; return;
  }
  all.sort((a,b)=>natCmp(a.name,b.name));
  all.forEach(p=>{ p.side=productSide(p.key); p.tags=productTags(p.key); p.tag=p.tags[0]||"other"; });

  // On a store room with twenty chemicals and ten fertilisers, one flat list is
  // a scroll. Group it — but only when grouping actually helps.
  // A tagged product appears under each of its tags - that is what a tag is for,
  // so the group counts add up to more than the number of products.
  const order=[...new Set([...allTags(), ...all.flatMap(p=>p.tags), "other"])];
  const groups=order.map(t=>({k:t, label:tagLabel(t),
      items: t==="other" ? all.filter(p=>!p.tags.length)
                         : all.filter(p=>p.tags.includes(t))}))
                    .filter(g=>g.items.length);
  const grouped = all.length>8 && groups.length>1;

  const rowFor=p=>{
    const wrap=document.createElement("div"); wrap.className="bal-wrap";
    const low=p.bal<-1e-9;
    // the tag repeats the heading once grouped, so drop it there
    const tag=(!grouped)?p.tags.map(t=>`<span class="bal-tag ${t==="fert"?"fert":""}">${esc(tagLabel(t))}</span>`).join(""):"";
    wrap.innerHTML=`<button class="bal-row" type="button">
        <span class="bal-n">${esc(p.name)}${tag}</span>
        <span class="bal-q${low?" low":""}">${low?S.stockShort(packsLabel(p.bal,p.pack)):packsLabel(p.bal,p.pack)}</span>
        <span class="bal-caret">\u203a</span>
      </button>
      <div class="bal-edit" hidden></div>`;
    const ed=wrap.querySelector(".bal-edit");
    if(balOpenKey===p.key){ ed.hidden=false; ed.innerHTML=""; fillProductMoves(ed,p); }
    wrap.querySelector(".bal-row").onclick=()=>{
      balOpenKey = (balOpenKey===p.key) ? "" : p.key;   // one open at a time
      renderStockBalances();
    };
    return wrap;
  };

  if(!grouped){ all.forEach(p=>host.appendChild(rowFor(p))); return; }
  const searching = fEl && !fEl.hidden && String(fEl.value||"").trim();
  groups.forEach(g=>{
    // a search should never hide its own hits behind a folded heading
    const folded = !searching && balFolded.has(g.k);
    const h=document.createElement("button"); h.className="bal-group"+(folded?" folded":"");
    h.type="button";
    h.innerHTML=`<span class="bg-caret">${folded?"\u203a":"\u2304"}</span>
      <span>${g.label}</span><span class="bg-n">${g.items.length}</span>`;
    h.onclick=()=>{
      if(balFolded.has(g.k)) balFolded.delete(g.k); else balFolded.add(g.k);
      renderStockBalances();
    };
    host.appendChild(h);
    if(!folded) g.items.forEach(p=>host.appendChild(rowFor(p)));
  });
}

// Buying is a shopping act, not part of a job — so it lives here and ends by
// putting the bags into stock. The quantity needed is carried over from the
// home screen when the product matches, so nothing is typed twice.
let buyDraft={ when:"", name:"", pack:"", need:"", buy:"", pN:"", pF:"", freeOv:"", price:"", note:"" };
// Whatever the home screen is currently working out — fertiliser AND every
// spray chemical — with what is already in stock, so the number offered is what
// actually has to be bought.
function buyNeeds(){
  const out=[];
  const add=(name,pack,need)=>{
    const nm=String(name||"").trim();
    if(!nm || !(need>0)) return;
    const key=prodKey(nm), b=stockBalance(key);
    const have=b.based?Math.max(0,b.bal):0;
    out.push({name:nm, pack:String(pack||"").trim()||packOf(key), need,
              have, haveKnown:b.based, short:Math.max(0, need-have)});
  };
  (state.fert.items||[]).forEach(it=>{
    const r=calcFert(it);
    if(r && r.ok && r.packsNeed!=null) add(it.name, it.pack, r.packsNeed);
  });
  (state.chems||[]).forEach(c=>{
    const r=calcChem(c);
    if(r && r.ok && r.packs!=null) add(c.name, c.pack, r.packs);
  });
  return out;
}
function buyLoad(n){
  buyDraft.name=n.name; buyDraft.pack=n.pack;
  const p=chemPriceByName(n.name); buyDraft.price = p!=null?String(p):"";
  // the useful figure is what still has to be bought, not the job total
  buyDraft.need=String(Math.round((n.haveKnown?n.short:n.need)*100)/100);
  buyDraft.buy=""; buyDraft.pN=""; buyDraft.pF=""; buyDraft.freeOv="";
  renderBuyForm();
}
function buyPrefill(){
  if(String(buyDraft.name||"").trim()) return;     // don't stomp on typing
  const needs=buyNeeds();
  if(needs.length===1) buyLoadSilent(needs[0]);
}
function buyLoadSilent(n){
  buyDraft.name=n.name; buyDraft.pack=n.pack;
  const p=chemPriceByName(n.name); buyDraft.price = p!=null?String(p):"";
  buyDraft.need=String(Math.round((n.haveKnown?n.short:n.need)*100)/100);
}
function buyNumbers(){
  const need=parseFloat(buyDraft.need);
  const ceilNeed=need>0?Math.max(1,Math.ceil(need-1e-9)):0;
  const tb=String(buyDraft.buy||"").trim();
  const paid=(tb!=="" && parseInt(tb,10)>=0) ? parseInt(tb,10) : ceilNeed;
  const pN=parseInt(buyDraft.pN,10), pF=parseInt(buyDraft.pF,10);
  const promo=(pN>0 && pF>0);
  const autoFree=promo?Math.floor(paid/pN)*pF:0;
  const tf=String(buyDraft.freeOv||"").trim();
  const manual=(tf!=="" && parseInt(tf,10)>=0);
  const free=manual?parseInt(tf,10):autoFree;
  const got=paid+free;
  let nudge=null;
  if(promo && paid>0){
    const nextT=(Math.floor(paid/pN)+1)*pN, more=nextT-paid;
    const window=Math.max(2, Math.ceil(pN/3));
    if(more>0 && more<=window) nudge={more, pay:nextT, get:nextT+Math.floor(nextT/pN)*pF};
  }
  return {need:need>0?need:0, ceilNeed, paid, free, autoFree, manual, promo, got, nudge,
          enough: need>0 ? got>=need-1e-9 : true, spare: got-(need>0?need:0)};
}

  const out=()=>{
    const b=buyNumbers();
    const pk=buyDraft.pack||packOf(prodKey(buyDraft.name));
    let h=`<div class="bo-row big"><span class="bo-k">${S.buyGot}</span><span class="bo-v">${packsLabel(b.got,pk)}${b.free>0?` <span class="free-tag">(${b.paid} + ${b.free} ${S.buyFree})</span>`:""}</span></div>`;
    if(b.need>0){
      h+= b.enough
        ? `<div class="bo-ok">${S.buyEnough(packsLabel(b.spare,pk))}</div>`
        : `<div class="bo-short">${S.buyShort(packsLabel(b.spare,pk))}</div>`;
    }
    const price=parseFloat(buyDraft.price);
    if(price>0 && b.paid>0){
      const total=price*b.paid;
      h+=`<div class="bo-row"><span class="bo-k">${S.buyTotal}</span><span class="bo-v">${rm(total)}</span></div>`;
      if(b.free>0 && b.got>0){
        // what the free bags actually bring the price down to — the number that
        // makes two shop offers comparable
        h+=`<div class="bo-row"><span class="bo-k">${S.buyEffective}</span><span class="bo-v">${rm(total/b.got)} ${S.perEach(unitWord(1, buyDraft.pack))}</span></div>`;
      }
    }
    if(b.nudge) h+=`<div class="bo-nudge">${S.buyNudge(b.nudge.more,b.nudge.pay,b.nudge.get)}</div>`;
    $("#buyOut").innerHTML=h;
    const warn=$("#buyPackWarn");
    if(warn) warn.textContent =
      (parseFloat(buyDraft.price)>0 && !parsePack(String(buyDraft.pack||"").trim())) ? S.pricePackWarn : "";
    const last=aliveMoves().filter(m=>m.key===prodKey(buyDraft.name) && m.kind==="in" && m.price>0)
      .sort((a,b)=>String(b.when||"").localeCompare(String(a.when||"")))[0];
    const lastEl=$("#buyLast");
    if(lastEl) lastEl.textContent = last ? S.buyLastPaid(rm(last.price)) : "";
    $("#buyFreeRow").hidden = b.promo && !b.manual;
    const pi=$("#buyPaid"); if(pi && document.activeElement!==pi) pi.placeholder=String(b.ceilNeed||"");
    host.querySelectorAll(".buy-u").forEach(el=>{ el.textContent=unitWord(2, buyDraft.pack); });
    host.querySelectorAll(".buy-u1").forEach(el=>{ el.textContent=S.perEach(unitWord(1, buyDraft.pack)); });
  };
  const digits=e=>{ const c=e.target.value.replace(/[^\d]/g,""); if(c!==e.target.value) e.target.value=c; return c; };
  $("#buyWhen").oninput=e=>buyDraft.when=e.target.value;
  const bnClr=$("#buyNameClear");
  const bnSync=()=>{ if(bnClr) bnClr.hidden = !String($("#buyName").value||"").trim(); };
  if(bnClr) bnClr.onclick=()=>{
    buyDraft.name=""; buyDraft.pack=""; buyDraft.price=""; buyAppliedKey="";
    $("#buyName").value=""; $("#buyPack").value=""; $("#buyPrice").value="";
    bnSync(); $("#buyName").focus(); out();
  };
  bnSync();
  $("#buyName").oninput=e=>{ buyDraft.name=e.target.value; bnSync();
    const hit=names.find(p=>p.key===prodKey(buyDraft.name));
    const k=prodKey(buyDraft.name);
    if(hit && k!==buyAppliedKey){                    // a different product now
      buyAppliedKey=k;
      buyDraft.pack=hit.pack||""; $("#buyPack").value=buyDraft.pack;
      const pr=chemPriceByName(hit.name);
      buyDraft.price = pr!=null?String(pr):""; $("#buyPrice").value=buyDraft.price;
    }
    redrawChips(host, buyDraft.name, k, p=>{
      buyDraft.name=p.name; buyDraft.pack=p.pack||"";
      const pr2=chemPriceByName(p.name); buyDraft.price = pr2!=null?String(pr2):"";
      buyAppliedKey=p.key;
      renderBuyForm();
      const q=$("#buyPaid"); if(q){ q.focus(); q.select&&q.select(); }
    });
    out(); };
  $("#buyPack").oninput=e=>{ buyDraft.pack=e.target.value; buyAppliedKey=prodKey(buyDraft.name); out(); };
  $("#buyNeed").oninput=e=>{ const c=e.target.value.replace(/[^\d.]/g,""); if(c!==e.target.value) e.target.value=c; buyDraft.need=c; out(); };
  $("#buyPaid").oninput=e=>{ buyDraft.buy=digits(e); out(); };
  $("#buyPrice").oninput=e=>{
    const c=e.target.value.replace(/[^\d.]/g,""); if(c!==e.target.value) e.target.value=c;
    buyDraft.price=c;
    // writing it here is enough — no purchase needed just to correct a price
    const nm=String(buyDraft.name||"").trim();
    if(nm && parseFloat(c)>0) setProductPrice(nm, String(buyDraft.pack||"").trim(), parseFloat(c));
    out();
  };
  $("#buyPn").oninput=e=>{ buyDraft.pN=digits(e); if(buyNumbers().promo) buyDraft.freeOv=""; out(); };
  $("#buyPf").oninput=e=>{ buyDraft.pF=digits(e); if(buyNumbers().promo) buyDraft.freeOv=""; out(); };
  $("#buyFree").oninput=e=>{ buyDraft.freeOv=digits(e); out(); };
  $("#buyNote").oninput=e=>buyDraft.note=e.target.value;
  $("#buySave").onclick=saveBuy;
  out();
}
// upsert the product's pack price, matched loosely by name
function setProductPrice(name, pack, price){
  const nm=String(name||"").trim(); if(!nm) return;
  const hit=alive(lists.chemProducts).find(x=>prodKey(x.name)===prodKey(nm));
  if(hit){
    chemProductSet(hit.id,"price",String(price));
    if(pack && !String(hit.pack||"").trim()) chemProductSet(hit.id,"pack",pack);
  } else chemProductAdd(nm, pack, String(price));
}
function saveBuy(){
  const S=STR[lang];
  const name=String(buyDraft.name||"").trim();
  const b=buyNumbers();
  if(!name || !(b.got>0)){ toast(S.stockNeedIn); return; }
  const price=parseFloat(buyDraft.price);
  const pack=String(buyDraft.pack||"").trim();
  moves.push({id:newId(), ts:nowTs(), when:$("#buyWhen").value||nowLocalInput(),
              key:prodKey(name), name, pack,
              kind:"in", packs:b.got, paid:b.paid, free:b.free,
              price: price>0?price:null, cost: price>0?price*b.paid:null,
              unitCost: price>0 ? (b.got>0 ? Math.round(((price*b.paid)/b.got)*10000)/10000 : price) : null,
              note:String(buyDraft.note||"").trim() || (b.free>0?S.buyWithFree(b.paid,b.free):"")});
  saveMoves();
  // buying is when you learn the price. Remember what a pack ACTUALLY cost:
  // total paid divided by packs received, so free packs lower the unit cost and
  // no hand adjustment is needed later.
  if(price>0){
    const effective = b.got>0 ? (price*b.paid)/b.got : price;
    setProductPrice(name, pack, Math.round(effective*10000)/10000);
  }
  buyDraft={when:"", name:"", pack:"", need:"", buy:"", pN:"", pF:"", freeOv:"", note:""};
  storeTab="onhand"; renderStock(); refreshStockLines(); toast(S.stockInSaved);
}

// where this product's stock went — the question you ask of a balance
function fillProductMoves(host,p){
  const S=STR[lang];
  const curList=productTags(p.key);
  const tags=[...new Set([...allTags(), ...curList])].filter(t=>t!=="other");
  const picker=document.createElement("div"); picker.className="tag-pick";
  picker.innerHTML=`<span class="tag-lab">${S.grpLabel}</span>`
    + tags.map(t=>`<button class="tag-chip${curList.includes(t)?" on":""}" type="button" data-t="${esc(t)}">${esc(tagLabel(t))}</button>`).join("")
    + `<button class="tag-chip tag-new" type="button">${S.tagNew}</button>`
    + (curList.length ? `<button class="tag-chip tag-clear" type="button">${S.tagClear}</button>` : "");
  const clr=picker.querySelector(".tag-clear");
  if(clr) clr.onclick=e=>{ e.stopPropagation();
    tagBinAdd(p.name, curList);          // recoverable from Settings -> Trash
    setProductTag(p.name, "");
    renderStockBalances(); refreshStockLines(); };
  picker.querySelectorAll(".tag-chip").forEach(b=>{
    if(b.classList.contains("tag-new") || b.classList.contains("tag-clear")) return;
    b.onclick=e=>{ e.stopPropagation();
      toggleProductTag(p.name, b.dataset.t);     // each tag goes on or off in its own right
      renderStockBalances(); refreshStockLines(); };
  });
  picker.querySelector(".tag-new").onclick=e=>{
    e.stopPropagation();
    const row=document.createElement("div"); row.className="tag-newrow";
    row.innerHTML=`<input class="tag-in" type="text" aria-label="${S.tagNew}" placeholder="${S.tagPh}">
      <button class="tag-save" type="button">${S.tagSave}</button>`;
    picker.after(row);
    const inEl=row.querySelector(".tag-in"); inEl.focus();
    const commit=()=>{
      const v=String(inEl.value||"").trim();
      if(!v) return;
      toggleProductTag(p.name, v);              // a new tag is added, not substituted
      renderStockBalances(); refreshStockLines();
    };
    row.querySelector(".tag-save").onclick=ev2=>{ ev2.stopPropagation(); commit(); };
    inEl.onkeydown=ev2=>{ if(ev2.key==="Enter") commit(); };
    inEl.onclick=ev2=>ev2.stopPropagation();
  };
  host.appendChild(picker);
  const ev=stockEvents(p.key).reverse().slice(0,8);
  if(!ev.length){
    const e0=document.createElement("div"); e0.className="pe-hr";
    e0.innerHTML=`<span>${S.stockEmpty}</span><span></span>`;
    host.appendChild(e0); return;
  }
  ev.forEach(e=>{
    const r=document.createElement("div"); r.className="pe-hr";
    r.innerHTML=`<span>${S.mvKind[e.kind]} \u00b7 ${fmtWhen(e.when)}${e.note?` \u00b7 ${esc(e.note)}`:""}</span>
      <span class="pe-hq">${packsLabel(e.packs, e.pack||p.pack)}</span>`;
    if(e.kind!=="use"){          // usage is derived from a log; delete the log instead
      const del=document.createElement("button");
      del.className="mv-del"; del.type="button"; del.setAttribute("aria-label","delete");
      del.textContent="\u{1F5D1}";
      del.onclick=async(ev2)=>{
        ev2.stopPropagation();
        if(await askConfirm(S.stockDelConfirm,{yes:S.confirmDelete})){
          moveRemove(e.id); renderStock(); refreshStockLines();
        }
      };
      r.appendChild(del);
    }
    host.appendChild(r);
  });
}

// One place to add a product. No blank rows to tidy up afterwards.
function redrawChips(host, typed, selKey, onPick){
  const old=host.querySelector(".prod-chips");
  const html=chipsHTML(typed, selKey);
  if(!html){ if(old) old.remove(); return; }
  const tmp=document.createElement("div"); tmp.innerHTML=html;
  const fresh=tmp.firstElementChild;
  if(old) old.replaceWith(fresh); else host.insertBefore(fresh, host.firstChild);
  const all=stockProducts();
  fresh.querySelectorAll(".prod-chip").forEach(b=>{
    b.onclick=()=>{ const p=all.find(x=>x.key===b.dataset.k); if(p) onPick(p); };
    const p0=all.find(x=>x.key===b.dataset.k);
    if(p0) attachChipRemove(b, p0, ()=>renderStock());
  });
}
// Press and hold a product chip to take it off the list. Only offered when
// nothing depends on it: a product with stock or history is removed by deleting
// that, not by hiding its name.
function chipRemovable(p){
  if(stockBalance(p.key).known) return false;      // has movements or usage
  return !!alive(lists.chemProducts).find(x=>prodKey(x.name)===p.key)
      || !!alive(lists.chemDoses).find(x=>prodKey(x.name)===p.key);
}
function removeChipProduct(p){
  const c=alive(lists.chemProducts).find(x=>prodKey(x.name)===p.key);
  if(c) chemProductRemove(c.id);
  const dz=alive(lists.chemDoses).find(x=>prodKey(x.name)===p.key);
  if(dz) chemDoseRemove(dz.id);
}
function attachChipRemove(btn, p, rerender){
  if(!chipRemovable(p)) return;
  btn.classList.add("chip-rm");
  btn.title=STR[lang].chipRemoveHint;
  let timer=null;
  const ask=async()=>{
    if(await askConfirm(STR[lang].chipRemoveConfirm(p.name), {yes:STR[lang].confirmDelete})){
      removeChipProduct(p); rerender(); refreshStockLines();
    }
  };
  const start=()=>{ timer=setTimeout(()=>{ timer=null; ask(); }, 550); };
  const stop=()=>{ if(timer){ clearTimeout(timer); timer=null; } };
  btn.addEventListener("pointerdown", start);
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>btn.addEventListener(ev, stop));
  btn.oncontextmenu=e=>{ e.preventDefault(); stop(); ask(); };
}

    const diff=t.packs-b.bal, pk2=it.pack||packOf(key);
    const dd=Math.round(Math.abs(diff)*100)/100;
    cmp.innerHTML=`<span class="cmp-exp">${S.stockExpected(packsLabel(b.bal,pk2))}</span>`
      + (dd>0.009 ? ` <span class="cmp-diff${diff>0?" up":""}">${(diff>0?S.stockMore:S.stockLess)(packsLabel(dd,pk2))}</span>`

  nameI.oninput=e=>{ it.name=e.target.value;

function saveStockCount(){
  const S=STR[lang];
  const when=$("#stockWhen").value||nowLocalInput();
  const note=String(countDraft.note||"").trim();
  const it=countEntry;
  if(!countEntryFilled()){ toast(S.stockNeedItem); return; }
  // A difference is normal — a little extra on weak trees, a spill, a bag bought
  // without logging. We ask for a word about it so the record explains itself
  // later; we never call it a loss. Only a SHORTFALL is worth a note — finding
  // more than the books is never the thing anyone is worried about, and asking
  // about it just trains people to ignore the prompt.
  const key=prodKey(it.name), b=stockBalance(key, when);
  const t=countItemPacks(it);
  if(b.based && (b.bal-t.packs)>0.5 && !note){
    toast(S.stockNeedNote);
    const el=$("#stockNote");
    if(el){ el.focus(); el.classList.add("shake"); setTimeout(()=>el.classList.remove("shake"),400); }
    return;
  }
  moves.push({id:newId(), ts:nowTs(), when, key, name:String(it.name).trim(),
              pack:String(it.pack||"").trim(), kind:"count", packs:t.packs, note});
  saveMoves();
  // keep the date so a run of products shares it; clear the rest for the next one
  countEntry=blankCountItem();
  countDraft.note="";
  renderStock(); refreshStockLines(); toast(S.stockSaved);
  const n=$("#ceName"); if(n) n.focus();
}


// One sheet per kind of movement, plus what is on hand today. Every row carries
// the product's tags, and each sheet is sorted by date and then by tag so like
// sits with like.
async function exportStockExcel(){ return exportAll(); }

// every sheet the app can produce, in reading order
async function exportAll(){
  const S=STR[lang];
  const sheets=[sheetMonthly(), sheetApplications(), ...stockSheets()].filter(Boolean);
  if(!sheets.length){ toast(S.stockEmpty); return; }
  await exportSheets(sheets, "chemlog");
}

function stockSheets(){
  const S=STR[lang];
  const ev=stockEvents();
  const onHand=stockProducts().map(p=>({...p, ...stockBalance(p.key)}))
      .filter(p=>p.based && Math.abs(p.bal)>1e-9);   // nothing left is not "on hand"
  if(!ev.length && !onHand.length) return [];

  const tagsFor=k=>productTags(k).map(tagLabel).join(", ");
  const qty=e=>Math.round(e.packs*100)/100;
  const amount=(packs,pack)=>{                       // the weight or volume it comes to
    const pk=pack?parsePack(pack):null;
    if(!pk) return ["",""];
    const m=scaleAmount(Math.abs(packs)*pk.baseVal, pk.family);
    return [Math.round(m.val*100)/100, m.unit];
  };
  // newest first, then grouped by tag, then by name
  const order=(a,b)=> String(b.when||"").localeCompare(String(a.when||""))
                   || tagsFor(a.key).localeCompare(tagsFor(b.key))
                   || natCmp(a.name||"", b.name||"");

  const sheets=[];
  const onH=onHand.slice().sort((a,b)=> tagsFor(a.key).localeCompare(tagsFor(b.key)) || natCmp(a.name,b.name));
  if(onH.length){
    const head=[S.xlName,S.xlTag,S.xlQty,S.fertPackLab,S.xlAmount,S.xlUnit];
    const rows=[head];
    onH.forEach(p=>{ const [v,u]=amount(p.bal,p.pack);
      rows.push([p.name, tagsFor(p.key), Math.round(p.bal*100)/100, p.pack||"", v, u]); });
    sheets.push({name:S.xlOnHand, file:"onhand", data:rows,
                 cols:[{wch:22},{wch:20},{wch:10},{wch:10},{wch:10},{wch:6}]});
  }

  const kinds=[["in",S.xlSheetIn,"in"],["use",S.xlSheetUsed,"used"],["count",S.xlSheetCount,"count"]];
  kinds.forEach(([kind,label,file])=>{
    const rows_=ev.filter(e=>e.kind===kind).sort(order);
    if(!rows_.length) return;
    const head=[S.xlDate,S.xlName,S.xlTag,S.xlQty,S.fertPackLab,S.xlAmount,S.xlUnit];
    if(kind==="in") head.push(S.buyPrice,S.xlUnitCost,S.buyTotal);
    head.push(S.stockNote);
    const data=[head];
    rows_.forEach(e=>{
      const pack=e.pack||packOf(e.key)||"";
      const [v,u]=amount(e.packs,pack);
      const row=[fmtWhen(e.when), e.name||"", tagsFor(e.key), qty(e), pack, v, u];
      if(kind==="in") row.push(e.price!=null?e.price:"",
                               e.unitCost!=null?e.unitCost:(e.price!=null?e.price:""),
                               e.cost!=null?e.cost:"");
      row.push(e.note||"");
      data.push(row);
    });
    const cols=[{wch:17},{wch:22},{wch:20},{wch:9},{wch:10},{wch:10},{wch:6}];
    if(kind==="in") cols.push({wch:10},{wch:12},{wch:11});
    cols.push({wch:28});
    sheets.push({name:label, file, data, cols});
  });

  return sheets;
}

  const host=$("#historyList"); host.innerHTML="";

// shared by the log and stock-count exports: xlsx when SheetJS loads, CSV when
// it does not (a farmer offline in the orchard still gets his file)
// One workbook, one sheet per section. CSV has no notion of sheets, so the
// offline fallback writes each sheet as its own file rather than mashing them
// into one table with mismatched columns.
async function exportSheets(sheets, stem){
  const S=STR[lang];
  sheets=(sheets||[]).filter(sh=>sh && sh.data && sh.data.length>1);
  if(!sheets.length){ toast(S.historyEmpty); return; }
  const d=new Date(), stamp=`${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}`;
  const who=deviceName();
  const namePart=safeFilePart(who);
  stem = namePart ? `${stem}_${namePart}` : stem;
  // provenance as its own sheet, so every data sheet keeps its header on row 1
  sheets=[{name:S.xlAbout, file:"about", cols:[{wch:18},{wch:30}], data:[
    [S.xlField, S.xlValue],
    [S.xlFrom, who || S.deviceUnnamed],
    [S.xlExported, fmtWhen(nowLocalInput())],
    [S.xlAppVer, APP_VER]
  ]}, ...sheets];
  const widths=sh=>sh.cols || (sh.data[0]||[]).map((h,i)=>({wch:i===0?16:14}));
  try{
    const XLSX=await loadSheetJS();
    const wb=XLSX.utils.book_new();
    sheets.forEach(sh=>{
      const ws=XLSX.utils.aoa_to_sheet(sh.data);
      ws["!cols"]=widths(sh);
      // Excel sheet names: 31 chars, no : \ / ? * [ ]
      const nm=String(sh.name||"Sheet").replace(/[:\\\/?*\[\]]/g,"-").slice(0,31);
      XLSX.utils.book_append_sheet(wb, ws, nm);
    });
    XLSX.writeFile(wb, `${stem}_${stamp}.xlsx`);
  }catch(err){
    sheets.forEach(sh=>{
      const csv=sh.data.map(r=>r.map(cell=>{ const v=String(cell==null?"":cell); return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v; }).join(",")).join("\n");
      const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
      const a=document.createElement("a"); const url=URL.createObjectURL(blob);
      a.href=url;
      const suffix=sheets.length>1 ? `_${String(sh.file||sh.name).replace(/[^A-Za-z0-9]+/g,"").toLowerCase()}` : "";
      a.download=`${stem}${suffix}_${stamp}.csv`;
      document.body.appendChild(a);      // same as the backup: detached anchors are ignored
      a.click(); a.remove();
      setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} }, 30000);
    });
    toast(sheets.length>1 ? S.exportedCsvMulti(sheets.length) : S.exportedCsv);
  }
}
async function exportGrid(data, stem, sheetName, cols){
  return exportSheets([{name:sheetName||"Sheet1", data, cols}], stem);
}
// ===== Chemical cost report =====
// total RM cost of a single log (sum of chem costs that have a price)
function logChemCost(r){
  return (r.chems||[]).reduce((s,c)=> s + (typeof c.cost==="number" ? c.cost : 0), 0);
}
function logAdjust(r){ const a=parseFloat(r.costAdjust); return isFinite(a)?a:0; }
function logCost(r){ return logChemCost(r) + logAdjust(r); }
// chems that could be costed now but were not when they were logged
function uncostedChems(r){
  return (r.chems||[]).filter(c=>{
    if(typeof c.cost==="number" && c.cost>0) return false;   // already costed; never overwrite
    if(c.packs==null || !(c.packs>0)) return false;
    return chemPriceByName(c.name)!=null;
  });
}
function uncostedLogs(){ return aliveLogs().filter(r=>uncostedChems(r).length); }
// Applies today's price to logs that never got one. Deliberately explicit: a
// cost is frozen when a log is saved, so this must be a decision, not a drift.
function backfillCosts(){
  let n=0;
  uncostedLogs().forEach(r=>{
    uncostedChems(r).forEach(c=>{
      const p=chemPriceByName(c.name);
      if(p==null) return;
      c.unitPrice=p; c.priceMode="pack"; c.priceUnit="pack";
      c.cost=Math.round(p*c.packs*100)/100;
      c.costBackfilled=1;                     // the record says it was priced later
      n++;
    });
  });
  if(n) saveLogs();
  return n;
}
function logHasCost(r){ return (r.chems||[]).some(c=>typeof c.cost==="number" && c.cost>0) || logAdjust(r)!==0; }
function logSetAdjust(id, val){
  const r=logs.find(x=>x.id===id); if(!r) return;
  const raw=String(val).replace(/[^\d.\-]/g,"").trim();
  const a=parseFloat(raw);
  r.costAdjust = isFinite(a)?a:0;
  // a lone "-" mid-typing is not a decision to clear; only a real zero or an
  // empty box drops the reason
  if(raw==="" || a===0) r.costAdjustWhy="";
  saveLogs();
}
function logAdjustWhy(r){ return String(r.costAdjustWhy||"").trim(); }
function logSetAdjustWhy(id, val){ const r=logs.find(x=>x.id===id); if(r){ r.costAdjustWhy=String(val||"").trim(); saveLogs(); } }
// month key from a log's `when`, e.g. "2026-07"
function logMonthKey(r){
  const d=new Date(r.when); if(isNaN(d)){ return (r.when||"").slice(0,7)||"—"; }
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
}
function monthLabel(key){
  const [y,m]=key.split("-"); if(!m) return key;
  const names = lang==="zh"
    ? ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"]
    : ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const mi=parseInt(m,10)-1;
  return lang==="zh" ? `${y}年${names[mi]||m}` : `${names[mi]||m} ${y}`;
}
function rm(n){ return "RM " + (Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}); }

// group alive+deleted logs by month for the report (only logs that carry a cost)
function costByMonth(includeDeleted){
  const src = includeDeleted ? logs.slice() : aliveLogs();
  const groups={};
  src.forEach(r=>{
    if(!logHasCost(r)) return;
    const key=logMonthKey(r);
    (groups[key]=groups[key]||[]).push(r);
  });
  return groups;
}

// Opening a panel from inside another one: make sure it lands on top, whatever
// order they happen to sit in the document.
function openPanel(sel){
  const el=$(sel); if(!el) return;
  const covering=$$(".panel").some(p=>p!==el && !p.hidden);
  el.classList.toggle("on-top", covering);
  el.hidden=false;
  el.scrollTop=0;
}
// Recompute the figures shown, leaving every input element in place. Rebuilding
// the panel while someone is typing steals the field out from under them.
function updateCostTotals(){
  const groups=costByMonth(false);
  let grand=0;
  Object.keys(groups).forEach(k=>groups[k].forEach(r=>grand+=logCost(r)));
  const g=$(".cg-amt"); if(g) g.textContent=rm(grand);
  $$(".cost-month").forEach(card=>{
    const key=card.dataset.month;
    const rows=groups[key]||[];
    const amt=card.querySelector(".cm-amt");
    if(amt) amt.textContent=rm(rows.reduce((s,r)=>s+logCost(r),0));
  });
  $$(".cost-log").forEach(line=>{
    const r=logs.find(x=>x.id===line.dataset.log);
    const t=line.querySelector(".cl-total");
    if(r && t) t.textContent=rm(logCost(r));
  });
}
function renderCostReport(){
  const S=STR[lang];
  $("#t-costTitle").textContent=S.costTitle;
  const host=$("#costBody"); host.innerHTML="";
  if(!$("#costFix")){
    const f=document.createElement("div"); f.className="cost-fix"; f.id="costFix"; f.hidden=true;
    host.parentNode.insertBefore(f, host);
  }
  if(!$("#costNote")){
    const n=document.createElement("div"); n.className="cost-hint"; n.id="costNote";
    host.parentNode.insertBefore(n, host);
  }

  const alive=costByMonth(false);
  const monthsAll=Object.keys(alive).sort().reverse();  // newest month first
  if(!costOpenMonths.size && monthsAll.length) costOpenMonths.add(monthsAll[0]);
  // spend and applied cost are different measures; say when they cannot agree
  const nUncosted=uncostedLogs().length;
  const fixEl=$("#costFix");
  if(fixEl){
    fixEl.hidden = !nUncosted;
    if(nUncosted){
      fixEl.innerHTML=`<span>${S.costUncosted(nUncosted)}</span>
        <button class="cf-btn" id="costFixBtn">${S.costUncostedFix}</button>`;
      fixEl.querySelector("#costFixBtn").onclick=async()=>{
        if(await askConfirm(S.costBackfillConfirm, {yes:S.costUncostedFix})){
          const n=backfillCosts();
          renderCostReport();
          toast(S.costBackfilled(n));
        }
      };
    }
  }
  const noteEl=$("#costNote");
  if(noteEl) noteEl.textContent = S.costWhatThisIs;

  if(!monthsAll.length){
    const e=document.createElement("div"); e.className="cost-empty"; e.textContent=S.costEmpty; host.appendChild(e);
  } else {
    // grand total
    let grand=0; monthsAll.forEach(k=> alive[k].forEach(r=> grand+=logCost(r)));
    const gt=document.createElement("div"); gt.className="cost-grand";
    gt.innerHTML=`<span>${S.costGrand}</span><span class="cg-amt">${rm(grand)}</span>`;
    host.appendChild(gt);

    monthsAll.forEach(key=>{
      const rows=alive[key];
      const monthTotal=rows.reduce((s,r)=>s+logCost(r),0);
      const card=document.createElement("div"); card.className="cost-month"; card.dataset.month=key;
      const open = costOpenMonths.has(key);
      const head=document.createElement("button"); head.className="cost-mhead"; head.type="button";
      head.innerHTML=`<span class="cm-caret">${open?"\u2304":"\u203a"}</span>
        <span class="cm-name">${monthLabel(key)}</span>
        <span class="cm-n">${S.costNLogs(rows.length)}</span>
        <span class="cm-amt">${rm(monthTotal)}</span>`;
      head.onclick=()=>{
        if(costOpenMonths.has(key)) costOpenMonths.delete(key); else costOpenMonths.add(key);
        renderCostReport();
      };
      card.appendChild(head);
      if(!open){ host.appendChild(card); return; }   // month closed: just the line
      // each log line, newest first
      rows.slice().sort((a,b)=>(b.when||"").localeCompare(a.when||"")).forEach(r=>{
        const line=document.createElement("div"); line.className="cost-log"; line.dataset.log=r.id;
        const priced=(r.chems||[]).filter(c=>typeof c.cost==="number"&&c.cost>0);
        // per-chemical breakdown — dose-priced (amount × RM/unit) vs pack-priced (packs × RM/pack)
        const breakdown = priced.map(c=>{
          let qty="";
          if(c.priceMode==="dose" && c.usedAmt!=null){
            qty = `${fmt(c.usedAmt)} ${c.priceUnit} × ${rm(c.unitPrice)}/${c.priceUnit}`;
          } else if(c.kind==="fert" && c.paid!=null){
            const fr = c.free ? ` (+${c.free} ${S.buyFree})` : "";
            qty = `${c.paid} ${c.packUnit||""} × ${rm(c.unitPrice)}${fr}`;
          } else if(c.packs!=null){
            qty = `${fmt(c.packs)} ${c.packUnit||""} × ${rm(c.unitPrice)}`;
          }
          return `<div class="cl-item"><span class="ci-name">${esc(c.name||"—")}</span><span class="ci-qty">${qty}</span><span class="ci-amt">${rm(c.cost)}</span></div>`;
        }).join("");
        const adj=logAdjust(r);
        const chemSum=logChemCost(r);
        // adjustment row (shows subtotal + adjust when non-zero)
        const subRow = `<div class="cl-sub" ${adj!==0?"":"hidden"}>
            <span>${S.costSubtotal}</span><span class="cs-amt">${rm(chemSum)}</span></div>`;
        const adjRow = subRow + `<div class="cl-adjust">
            <span class="ca-lab">${S.costAdjustLabel}</span>
            <div class="ca-input"><span class="ca-rm">RM</span><input class="ca-field" name="costAdjust" inputmode="decimal" value="${adj!==0?esc(String(adj)):''}" placeholder="0" aria-label="${S.costAdjustLabel}"></div>
          </div>
          <input class="ca-why" name="costAdjustWhy" type="text" value="${esc(logAdjustWhy(r))}"
                 placeholder="${S.costAdjustWhyPh}" aria-label="${S.costAdjustWhy}" ${adj!==0?"":"hidden"}>
          <div class="ca-saved" ${adj!==0&&logAdjustWhy(r)?"":"hidden"}>${S.costAdjustSaved(esc(logAdjustWhy(r)))}</div>
          <div class="cl-after" ${adj!==0?"":"hidden"}><span>${S.costAfterAdjust}</span><span class="cs-amt">${rm(logCost(r))}</span></div>`;
        line.innerHTML=`<div class="cl-head">
            <span class="cl-when">${fmtWhen(r.when)}</span>
            <span class="cl-total">${rm(logCost(r))}</span>
            <button class="cl-del" aria-label="delete">🗑</button>
          </div>
          <div class="cl-items">${breakdown}</div>
          ${adjRow}`;
        line.querySelector(".cl-del").onclick=async()=>{
          if(await askConfirm(S.costDelConfirm, {yes:S.confirmDelete})){ logRemove(r.id); renderCostReport(); refreshStockLines(); }
        };
        const af=line.querySelector(".ca-field");
        const wf=line.querySelector(".ca-why");
        af.oninput=e=>{
          const cl=e.target.value.replace(/[^\d.\-]/g,"");
          if(cl!==e.target.value){const p=e.target.selectionStart;e.target.value=cl;e.target.setSelectionRange(p,p);}
          logSetAdjust(r.id, cl);          // save on every keystroke, not on blur
          if(wf) wf.hidden = !parseFloat(cl);
          const a2=logAdjust(r);
          const sub=line.querySelector(".cl-sub"), aft=line.querySelector(".cl-after");
          if(sub) sub.hidden = a2===0;
          if(aft){ aft.hidden = a2===0; aft.querySelector(".cs-amt").textContent=rm(logCost(r)); }
          updateCostTotals();              // in place: never rebuild under the cursor
        };
        af.onchange=af.oninput;
        const sv=line.querySelector(".ca-saved");
        const showSaved=()=>{
          if(!sv) return;
          const t=logAdjustWhy(r);
          sv.hidden = !(logAdjust(r)!==0 && t);
          if(!sv.hidden) sv.textContent=S.costAdjustSaved(t);
        };
        if(wf){
          wf.oninput=e=>{ logSetAdjustWhy(r.id, e.target.value); showSaved(); };
          wf.onchange=wf.oninput;
        }
        af.addEventListener("input", showSaved);   // clearing the amount clears it too
        card.appendChild(line);
      });
      host.appendChild(card);
    });
  }

  // trashed cost logs (restore / purge)
  const del=deletedLogs().filter(logHasCost);
  if(del.length){
    const th=document.createElement("div"); th.className="cost-trash-h"; th.textContent=S.costTrash; host.appendChild(th);
    del.forEach(r=>{
      const priced=(r.chems||[]).filter(c=>typeof c.cost==="number"&&c.cost>0);
      const names=priced.map(c=>c.name).filter(Boolean).join(", ");
      const line=document.createElement("div"); line.className="cost-log trashed";
      line.innerHTML=`<div class="cl-head">
          <span class="cl-when">${fmtWhen(r.when)}</span>
          <span class="cl-total">${rm(logCost(r))}</span>
        </div>
        <div class="cl-chems-min">${esc(names||"—")}</div>
        <div class="cl-trash-btns">
          <button class="cl-restore">${S.restore}</button>
          <button class="cl-purge" aria-label="purge">✕</button>
        </div>`;
      line.querySelector(".cl-restore").onclick=()=>{ logRestore(r.id); renderCostReport(); refreshStockLines(); };
      line.querySelector(".cl-purge").onclick=async()=>{ if(await askConfirm(S.purgeConfirm,{yes:S.purgeYes})){ logPurge(r.id); renderCostReport(); } };
      host.appendChild(line);
    });
  }
}

// One workbook for everything, from either export button. Money is written as
// NUMBERS, not "RM ..." text, so a year of months can actually be summed and
// pivoted in Excel.
function tagsForKey(k){ return productTags(k).map(tagLabel).join(", "); }

function sheetMonthly(){
  const S=STR[lang];
  const groups=costByMonth(false);
  const months=Object.keys(groups).sort();          // oldest first: reads as a year
  // cash actually spent, by month, from the purchase ledger
  const buys={};
  aliveMoves().filter(m=>m.kind==="in" && m.cost>0).forEach(m=>{
    const k=String(m.when||"").slice(0,7);
    buys[k]=(buys[k]||0)+m.cost;
  });
  const keys=[...new Set([...months, ...Object.keys(buys)])].sort();
  if(!keys.length) return null;
  // purchases saved without a price, and stock that arrived by a count rather
  // than a purchase: both let applied cost exceed recorded spend
  const noPrice={}, counted={};
  aliveMoves().forEach(m=>{
    const k=String(m.when||"").slice(0,7);
    if(m.kind==="in" && !(m.cost>0)) noPrice[k]=(noPrice[k]||0)+1;
    if(m.kind==="count") counted[k]=(counted[k]||0)+1;
  });
  const head=[S.xlMonth,S.xlApplied,S.xlSpent,S.xlNoPrice,S.xlCounted];
  const data=[head];
  let ta=0, tb=0, tn=0, tc=0;
  keys.forEach(k=>{
    const applied=(groups[k]||[]).reduce((sum,r)=>sum+logCost(r),0);
    const spent=buys[k]||0;
    ta+=applied; tb+=spent; tn+=(noPrice[k]||0); tc+=(counted[k]||0);
    data.push([monthLabel(k), round2(applied), round2(spent), noPrice[k]||0, counted[k]||0]);
  });
  data.push([S.costGrand, round2(ta), round2(tb), tn, tc]);
  return {name:S.xlMonthly, file:"monthly", data,
          cols:[{wch:14},{wch:14},{wch:14},{wch:14},{wch:14}]};
}

function sheetApplications(){
  const S=STR[lang];
  const groups=costByMonth(false);
  const months=Object.keys(groups).sort();
  const head=[S.xlDate,S.xlMonth,S.xlName,S.xlTag,S.xlQty,S.xlUnit,S.costUnitPrice,S.costCol];
  const data=[head];
  months.forEach(key=>{
    groups[key].slice().sort((a,b)=>(a.when||"").localeCompare(b.when||"")).forEach(r=>{
      (r.chems||[]).forEach(c=>{
        if(typeof c.cost!=="number" || !(c.cost>0)) return;
        const dose=(c.priceMode==="dose" && c.usedAmt!=null);
        data.push([ fmtWhen(r.when), monthLabel(key), c.name||"", tagsForKey(prodKey(c.name)),
                    dose?round2(c.usedAmt):(c.packs!=null?round2(c.packs):""),
                    dose?(c.priceUnit||""):(c.packUnit||""),
                    c.unitPrice!=null?round2(c.unitPrice):"", round2(c.cost) ]);
      });
      const adj=logAdjust(r);
      if(adj!==0) data.push([ fmtWhen(r.when), monthLabel(key), S.costAdjustLabel, logAdjustWhy(r), "", "", "", round2(adj) ]);
    });
  });
  if(data.length===1) return null;
  return {name:S.xlApplied, file:"applications", data,
          cols:[{wch:17},{wch:12},{wch:22},{wch:20},{wch:9},{wch:9},{wch:11},{wch:11}]};
}
function round2(n){ return Math.round(n*100)/100; }
